# PostgreSQL connection settings
# The password is read from the DB_PASSWORD environment variable and must never be committed.
spring.datasource.url=jdbc:postgresql://localhost:5432/saferoute_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA & Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# With "update", tables are created/updated automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
